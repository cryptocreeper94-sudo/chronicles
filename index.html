    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="description"
        content="Chronicles by DarkWave Studios — A life simulation across three historical eras with AI-driven narrative, persistent NPCs, and blockchain-verified decisions." />
    <title>Chronicles — by DarkWave Studios</title>

    <!-- DarkWave Studios Ecosystem Analytics -->
    <script>
      (function(){
        var appId = document.querySelector('meta[name="dw-app-id"]');
        var id = appId ? appId.content : window.location.hostname;
        function track(type, data) {
          try {
            navigator.sendBeacon('https://darkwavestudios.io/api/analytics', JSON.stringify({
              app: id, type: type, url: window.location.href,
              ref: document.referrer, ts: Date.now(), ...data
            }));
          } catch(e) {}
        }
        track('pageview');
        window.addEventListener('popstate', function(){ track('navigate'); });
        var origPush = history.pushState;
        history.pushState = function(){ origPush.apply(this, arguments); track('navigate'); };
      })();
    </script>
  </head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Trust Layer Ecosystem Vector -->
    <script src="https://dwtl.io/api/ecosystem/shared/loader.js" 
      data-api="https://dwtl.io" 
      data-components="announcement-bar" 
      data-theme="dark" defer></script>
      
    <!-- Global Signal Chat Widget -->
    <script src="https://signal-chat.tlid.io/widget.js" 
      data-hub="chronicles" 
      data-position="bottom-right" 
      async defer></script>
</body>
